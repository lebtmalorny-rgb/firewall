<text x="26" y="854" class="note">При VXLAN между узлами добавляется UDP 4789, при Geneve — UDP 6081. Внутри остаётся TCP 8080.</text>
<rect x="26" y="870" width="502" height="72" rx="8" fill="#f1effc" stroke="#aaa0cf"/>
<text x="39" y="891" class="tag" fill="#59458a">CONTROL  ·  ДРУГИЕ API</text>
<text x="39" y="913" class="note">Cinder 8776  ·  Glance 9292  ·  Neutron 9696  ·  Placement 8780</text>
<text x="39" y="934" class="note">TCP, по правилам для опубликованных API.</text>
<rect x="540" y="870" width="514" height="72" rx="8" fill="#e8f6f2" stroke="#8fb8ad"/>
<text x="553" y="891" class="tag" fill="#206553">COMPUTE  ·  СЛУЖЕБНЫЕ ВХОДЫ</text>
<text x="553" y="913" class="note">libvirt с control и compute: TCP 16509, при TLS также 16514.</text>
<text x="553" y="934" class="note">Миграция с другого compute: TCP 8022 и 49152–49261.</text>
<rect x="26" y="953" width="1028" height="36" rx="8" fill="#fcf0ed" stroke="#e7c0b5"/>
<text x="40" y="976" class="note">Обычному клиенту закрыт прямой вход к БД (3306), RabbitMQ (5671/5672) и VNC на compute (5900–5999).</text>
<rect x="0" y="1003" width="1080" height="105" rx="0" fill="#f2f6f8" stroke="none"/>
<text x="26" y="1027" class="sub">Host-firewall проверяет вход на IP узла. Security Group (SG) проверяет трафик порта ВМ.</text>
<text x="26" y="1055" class="note">¹ 443 — единый вход с HTTPS. При раздельных входах берите порт из публичного URL сервиса или консоли.</text>
<text x="26" y="1081" class="note">² 3306 — обычный порт. При отключённом ProxySQL используйте фактический внутренний адрес БД.</text>
</svg>
