<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1108" viewBox="0 0 1080 1108" role="img" aria-labelledby="heading description">
<title id="heading">Как пользователь попадает в OpenStack и виртуальные машины</title>
<desc id="description">Пять маршрутов. Панель и API через публичный VIP на control. Браузерная консоль через noVNC на control к VNC выбранной ВМ на compute. SSH через Floating IP, DNAT и группу безопасности к гостевой ОС. Внутренние соединения служб с RabbitMQ и БД. Две ВМ в сети проекта и возможный туннель между гипервизорами.</desc>
